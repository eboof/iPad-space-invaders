<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>iPad Space Invaders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Level: <span id="level">1</span></div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="900" height="1200" aria-label="Space Invaders game"></canvas>
      <div class="overlay" id="overlay">
        <h1>iPad Space Invaders</h1>
        <p>Tap Start. Drag left/right to move. Tap Fire to shoot.</p>
        <button id="startButton">Start Game</button>
      </div>
    </section>

    <section class="controls" aria-label="Touch controls">
      <button class="control control-wide" id="leftButton">◀</button>
      <button class="control control-fire" id="fireButton">FIRE</button>
      <button class="control control-wide" id="rightButton">▶</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
