<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Space Invaders" />
  <title>iPad Space Invaders</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Level: <span id="level">1</span></div>
      <div>Best: <span id="bestScore">0</span></div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="900" height="1200" aria-label="Space Invaders game"></canvas>
      <div class="scanlines"></div>
      <div class="overlay" id="overlay">
        <h1>iPad Space Invaders</h1>
        <p>Tap Start. Drag left/right to move. Tap Fire to shoot. Add to Home Screen for full-screen play.</p>
        <div class="overlay-actions">
          <button id="startButton">Start Game</button>
          <button id="soundButton" class="secondary-button">Sound: On</button>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="Touch controls">
      <button class="control control-wide" id="leftButton">◀</button>
      <button class="control control-fire" id="fireButton">FIRE</button>
      <button class="control control-wide" id="rightButton">▶</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
